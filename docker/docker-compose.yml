version: '3.8'

services:
  rag-chatbot:
    build:
      context: ../source_code    
      dockerfile: ../docker/Dockerfile
    container_name: chatbot

    ports:
      - "8501:8501"
        
    volumes:
      - ../source_code/data:/app/data
      
    extra_hosts:
      - "host.docker.internal:host-gateway"